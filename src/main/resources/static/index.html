<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiral Galaxy Simulator (Barnes–Hut)</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-dark text-light">
  <div class="container-fluid p-3">
    <div class="row g-3">
      <div class="col-lg-9">
        <canvas id="canvas" width="800" height="800" class="border border-secondary w-100"></canvas>
      </div>
      <div class="col-lg-3">
        <div class="card bg-secondary-subtle text-dark">
          <div class="card-body">
            <h5 class="card-title">Controls</h5>
            <div class="mb-3">
              <label for="speed" class="form-label">Time scale (years/sec)</label>
              <input type="range" class="form-range" id="speed" min="2" max="8" step="0.01" />
              <div><span id="speedLabel">1.0e6</span> yr/s</div>
            </div>
            <div class="mb-3 d-grid gap-2">
              <button id="pauseBtn" class="btn btn-warning">Pause/Resume</button>
              <button id="resetBtn" class="btn btn-danger">Reset</button>
              <button id="ffBtn" class="btn btn-primary">Fast-forward (100 Myr/s)</button>
            </div>
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" role="switch" id="barToggle">
              <label class="form-check-label" for="barToggle">Enable bar potential</label>
            </div>
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" role="switch" id="qtToggle">
              <label class="form-check-label" for="qtToggle">Show quadtree overlay (client-only)</label>
            </div>
            <div class="mb-1">Sim time: <span id="simTime">0 yr</span></div>
            <div class="mb-1">Particles: ~<span id="ptCount">0</span></div>
            <div class="mb-1">Steps: <span id="steps">0</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
