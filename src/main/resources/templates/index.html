<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Simulation</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { text-align: center; color: #4fc3f7; margin: 0 0 20px 0; flex-shrink: 0; }
        .main-panel {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            min-height: 0;
        }
        .canvas-container {
            flex-grow: 1;
            border: 2px solid #333;
            border-radius: 8px;
            background: #000;
            position: relative;
        }
        #galaxyCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            cursor: grab;
        }
        #galaxyCanvas:active { cursor: grabbing; }
        .sidebar {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .controls-panel, .stats-panel {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .controls-panel { overflow-y: auto; }
        .control-group h3 { margin: 0 0 10px 0; color: #4fc3f7; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .button-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background-color 0.3s; background-color: #4fc3f7; color: #000; }
        button:hover { background-color: #81d4fa; }
        button.active { background-color: #ffeb3b; box-shadow: 0 0 10px #ffeb3b; }
        input[type="range"] { width: 100%; margin: 10px 0; }
        input[type="text"] { width: 40px; padding: 4px; border: 1px solid #666; border-radius: 4px; background: #333; color: #fff; font-size: 14px; text-align: right; }
        .input-group { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
        .checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 10px;}
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: bold; color: #4fc3f7; word-wrap: break-word; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 14px; }
        .legend-color { width: 15px; height: 15px; border-radius: 50%; display: inline-block; border: 1px solid #555; }
    </style>
</head>
<body>
<div class="container">
    <h1>Galaxy Simulation</h1>
    <div class="main-panel">
        <div class="canvas-container">
            <canvas id="galaxyCanvas"></canvas>
            <div id="fps-counter" style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; font-size: 12px;">FPS: 0</div>
        </div>
        <div class="sidebar">
            <div class="controls-panel">
                <div class="control-group">
                    <h3>Simulation Control</h3>
                    <div class="button-group">
                        <button id="playBtn">▶ Start</button>
                        <button id="resetBtn">⟲ Reset</button>
                        <button id="fastForwardBtn">⏩ FF</button>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Time Scale</h3>
                    <input type="range" id="timeScaleSlider" min="2" max="8" step="0.01" value="7">
                    <div class="input-group">
                        <label for="timeScaleInput">Scale (yr/s):</label>
                        <input type="text" id="timeScaleInput" style="width: 90px;">
                    </div>
                </div>
                <div class="control-group">
                    <h3>Particle Count</h3>
                    <input type="range" id="particleCountSlider" min="1000" max="50000" step="100" value="10000">
                    <div class="input-group">
                        <label for="particleCountInput">Count:</label>
                        <input type="text" id="particleCountInput" style="width: 60px;">
                    </div>
                </div>
                <div class="control-group">
                    <h3>Physics & Visuals</h3>
                    <div class="checkbox-container"><input type="checkbox" id="barPotentialCheck"><label for="barPotentialCheck">Bar Potential</label></div>
                    <div class="checkbox-container"><input type="checkbox" id="motionTrailsCheck"><label for="motionTrailsCheck">Motion Trails</label></div>
                    <input type="range" id="spiralArmSlider" min="1" max="5" step="1" value="2">
                    <div class="input-group">
                        <label for="spiralArmInput">Spiral Arms:</label>
                        <input type="text" id="spiralArmInput">
                    </div>
                    <input type="range" id="smbhMassSlider" min="0.1" max="1000" step="0.1" value="4">
                    <div class="input-group">
                        <label for="smbhMassInput">SMBH Mass (10⁶ M☉):</label>
                        <input type="text" id="smbhMassInput" style="width: 50px;">
                    </div>
                </div>
                <div class="control-group">
                    <h3>Legend</h3>
                    <div class="legend-item"><span class="legend-color" style="background-color: #42a5f5;"></span><span>Disk Population</span></div>
                    <div class="legend-item"><span class="legend-color" style="background-color: #ffca28;"></span><span>Bulge Population</span></div>
                    <div class="legend-item"><span class="legend-color" style="background-color: #ff4d4d;"></span><span>SMBH</span></div>
                </div>
            </div>
            <div class="stats-panel">
                <h3 style="text-align: center; margin-bottom: 20px;">Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-label">Time</div><div class="stat-value" id="simTime">0.00 Myr</div></div>
                    <div class="stat-item"><div class="stat-label">Particles</div><div class="stat-value" id="particleCount">0</div></div>
                    <div class="stat-item"><div class="stat-label">Avg Velocity</div><div class="stat-value" id="avgVelocity">0 km/s</div></div>
                    <div class="stat-item"><div class="stat-label">Avg Distance</div><div class="stat-value" id="avgDistance">0 pc</div></div>
                    <div class="stat-item"><div class="stat-label">Energy</div><div class="stat-value" id="totalEnergy">0</div></div>
                    <div class="stat-item"><div class="stat-label">Energy Drift</div><div class="stat-value" id="energyDrift">0.00%</div></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    let canvas, ctx, isRunning = false, showMotionTrails = false, zoom = 1.0, offsetX = 0, offsetY = 0, isDragging = false, lastMouseX, lastMouseY, lastFrameTime = 0;
    let simulationState = { particles: [], currentTime: 0, energy: 0, energyDrift: 0, particleCount: 0, avgVelocity: 0, avgDistanceToCenter: 0, fastForward: false };
    let socket;

    window.onload = () => {
        canvas = document.getElementById('galaxyCanvas');
        ctx = canvas.getContext('2d');
        setupEventListeners();
        startAnimationLoop();
        connectWebSocket();
    };

    function connectWebSocket() {
        const socketUrl = `ws://${window.location.host}/simulation-socket`;
        socket = new WebSocket(socketUrl);

        socket.onopen = () => {
            console.log("WebSocket connected.");
            postRequest('/api/reset', {});
        };

        socket.onmessage = (event) => {
            simulationState = JSON.parse(event.data);
            if (isRunning !== simulationState.isRunning) {
                isRunning = simulationState.isRunning;
                document.getElementById('playBtn').textContent = isRunning ? '⏸ Pause' : '▶ Start';
            }
            document.getElementById('fastForwardBtn').classList.toggle('active', simulationState.fastForward);
            updateUI();
        };

        socket.onclose = () => {
            console.log("WebSocket disconnected. Attempting to reconnect...");
            setTimeout(connectWebSocket, 2000);
        };

        socket.onerror = (error) => console.error("WebSocket Error:", error);
    }

    function setupEventListeners() {
        const canvasContainer = document.querySelector('.canvas-container');
        const resizeObserver = new ResizeObserver(entries => {
            for (const entry of entries) {
                const { width, height } = entry.contentRect;
                canvas.width = width;
                canvas.height = height;
            }
        });
        resizeObserver.observe(canvasContainer);

        canvas.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);
        canvas.addEventListener('mousemove', e => {
            if (isDragging) {
                const worldToCanvasScale = (canvas.width / 30000) * zoom;
                offsetX -= (e.clientX - lastMouseX) / worldToCanvasScale;
                offsetY += (e.clientY - lastMouseY) / worldToCanvasScale;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        canvas.addEventListener('wheel', e => { e.preventDefault(); zoom *= e.deltaY > 0 ? 0.9 : 1.1; zoom = Math.max(0.1, Math.min(20, zoom)); });

        document.getElementById('playBtn').addEventListener('click', () => postRequest(isRunning ? '/api/pause' : '/api/start', {}));
        document.getElementById('resetBtn').addEventListener('click', () => postRequest('/api/reset', {}));
        document.getElementById('fastForwardBtn').addEventListener('click', toggleFastForward);

        window.addEventListener('keydown', e => {
            if (document.activeElement.tagName === 'INPUT') return;
            switch (e.code) {
                case 'Space': e.preventDefault(); postRequest(isRunning ? '/api/pause' : '/api/start', {}); break;
                case 'KeyR': e.preventDefault(); postRequest('/api/reset', {}); break;
                case 'KeyF': e.preventDefault(); toggleFastForward(); break;
            }
        });

        // Two-way binding helper for sliders and text inputs
        function setupTwoWayBinding(sliderId, inputId, isLog, toApi, isFloat = false) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            const updateFromSlider = () => {
                let value = isLog ? Math.pow(10, parseFloat(slider.value)) : parseFloat(slider.value);
                input.value = isLog ? value.toExponential(1) : (isFloat ? value.toFixed(1) : value);
            };
            const updateFromInput = () => {
                let value = isLog ? parseFloat(input.value) : (isFloat ? parseFloat(input.value) : parseInt(input.value, 10));
                if (isNaN(value)) return value; // Return NaN to signal error
                value = Math.max(Number(slider.min), Math.min(value, Number(slider.max)));
                slider.value = isLog ? Math.log10(value) : value;
                input.value = isLog ? value.toExponential(1) : (isFloat ? value.toFixed(1) : value);
                return value;
            };
            slider.addEventListener('input', updateFromSlider);
            slider.addEventListener('change', () => toApi(isLog ? Math.pow(10, parseFloat(slider.value)) : parseFloat(slider.value)));
            input.addEventListener('change', () => {
                const value = updateFromInput();
                if(!isNaN(value)) toApi(value);
            });
            updateFromSlider(); // Initial sync
        }

        setupTwoWayBinding('timeScaleSlider', 'timeScaleInput', true, (val) => postRequest('/api/timeScale', { timeScale: val }));
        setupTwoWayBinding('particleCountSlider', 'particleCountInput', false, (val) => postRequest('/api/particleCount', { count: val }));
        setupTwoWayBinding('spiralArmSlider', 'spiralArmInput', false, (val) => postRequest('/api/spiralArms', { arms: val }));
        setupTwoWayBinding('smbhMassSlider', 'smbhMassInput', false, (val) => postRequest('/api/smbhMass', { mass: val }), true);

        document.getElementById('barPotentialCheck').addEventListener('change', () => postRequest('/api/barPotential', { enabled: document.getElementById('barPotentialCheck').checked }));
        document.getElementById('motionTrailsCheck').addEventListener('change', (e) => showMotionTrails = e.target.checked);
    }

    async function toggleFastForward() {
        await postRequest('/api/fastForward', { enabled: !simulationState.fastForward });
    }

    function startAnimationLoop() {
        const animate = (t) => {
            if (lastFrameTime > 0) {
                document.getElementById('fps-counter').textContent = `FPS: ${Math.round(1000 / (t - lastFrameTime))}`;
            }
            lastFrameTime = t;
            render();
            requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
    }

    function render() {
        ctx.save();

        // Handle motion trails effect
        if (showMotionTrails) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Center the coordinate system and apply zoom and pan
        ctx.translate(canvas.width / 2, canvas.height / 2);
        const worldToCanvasScale = (canvas.width / 30000);
        ctx.scale(zoom * worldToCanvasScale, zoom * worldToCanvasScale);
        ctx.translate(-offsetX, -offsetY);

        if (simulationState) {
            const lineWidth = 1 / (zoom * worldToCanvasScale);
            const particleRadius = 1.2 / (zoom * worldToCanvasScale);

            if (simulationState.particles) renderParticles(particleRadius);
            renderSmbh(lineWidth);
        }

        ctx.restore();
    }

    function renderParticles(radius) {
        ctx.globalAlpha = 0.8;
        const particles = simulationState.particles;
        for (let i = 0; i < particles.length; i += 3) {
            const pX = particles[i], pY = particles[i + 1], pType = particles[i + 2];
            ctx.fillStyle = pType === 1 ? '#ffca28' : '#42a5f5';
            ctx.beginPath();
            ctx.arc(pX, -pY, radius, 0, 2 * Math.PI);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
    }

    function renderSmbh(lineWidth) {
        ctx.fillStyle = '#ff4d4d';
        ctx.strokeStyle = '#ffaeae';
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
    }

    function updateUI() {
        if (!simulationState) return;
        document.getElementById('simTime').textContent = `${(simulationState.currentTime / 1e6).toFixed(2)} Myr`;
        document.getElementById('totalEnergy').textContent = simulationState.energy ? simulationState.energy.toExponential(2) : '0';
        document.getElementById('energyDrift').textContent = `${(simulationState.energyDrift * 100).toFixed(4)}%`;
        document.getElementById('particleCount').textContent = simulationState.particleCount;
        document.getElementById('avgVelocity').textContent = `${Math.round(simulationState.avgVelocity)} km/s`;
        document.getElementById('avgDistance').textContent = `${Math.round(simulationState.avgDistanceToCenter)} pc`;
    }

    async function postRequest(url, body) {
        try {
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        } catch (error) {
            console.error('Error posting request:', error);
        }
    }
</script>
</body>
</html>
