<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Simulation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #0a0a0a; color: #ffffff; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #4fc3f7; margin-bottom: 20px; }
        .simulation-panel { display: flex; gap: 20px; margin-bottom: 20px; }
        .canvas-container { flex: 1; border: 2px solid #333; border-radius: 8px; background: #000; position: relative; }
        #galaxyCanvas { display: block; width: 800px; height: 800px; background: #000; cursor: grab; }
        #galaxyCanvas:active { cursor: grabbing; }
        .controls-panel { width: 300px; background: #1a1a1a; border-radius: 8px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { margin: 0 0 10px 0; color: #4fc3f7; font-size: 16px; }
        .button-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background-color 0.3s; }
        input[type="range"] { width: 100%; margin: 10px 0; }
        input[type="text"] { width: 90px; padding: 4px; border: 1px solid #666; border-radius: 4px; background: #333; color: #fff; font-size: 14px; }
        .checkbox-container { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
        .input-group { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .stats-panel { background: #1a1a1a; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #4fc3f7; }
    </style>
</head>
<body>
<div class="container">
    <h1>Galaxy Simulation - Barnes-Hut N-Body Dynamics</h1>
    <div class="simulation-panel">
        <div class="canvas-container" style="position: relative;">
            <canvas id="galaxyCanvas" width="800" height="800"></canvas>
            <div id="fps-counter" style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; font-size: 12px;">FPS: 0</div>
        </div>
        <div class="controls-panel">
            <div class="control-group">
                <h3>Simulation Control</h3>
                <div class="button-group">
                    <button id="playBtn">▶ Start</button>
                    <button id="resetBtn">⟲ Reset</button>
                </div>
            </div>
            <div class="control-group">
                <h3>Time Scale</h3>
                <input type="range" id="timeScaleSlider" min="2" max="8" step="0.01" value="5">
                <div class="input-group"><label>Scale:</label><input type="text" id="timeScaleInput" size="10"><span>yr/s</span></div>
            </div>
            <div class="control-group">
                <h3>Particle Count</h3>
                <input type="range" id="particleCountSlider" min="1000" max="50000" step="100" value="1000">
                <div class="input-group"><label>Count:</label><input type="text" id="particleCountInput" size="10"></div>
            </div>
            <div class="control-group">
                <h3>Physics Options</h3>
                <div class="checkbox-container"><input type="checkbox" id="quadtreeOverlayCheck"><label>Quadtree Overlay</label></div>
                <input type="range" id="quadtreeDepthSlider" min="1" max="15" value="8">
                <div>Depth: <span id="quadtreeDepthValue">8</span></div>
                <div class="checkbox-container"><input type="checkbox" id="barPotentialCheck"><label>Bar Potential</label></div>
                <input type="range" id="spiralArmSlider" min="1" max="5" step="1" value="2">
                <div>Spiral Arms: <span id="spiralArmValue">2</span></div>
            </div>
        </div>
    </div>
    <div class="stats-panel">
        <h3 style="text-align: center; margin-bottom: 20px;">Simulation Statistics</h3>
        <div class="stats-grid">
            <div class="stat-item"><div class="stat-label">Time</div><div class="stat-value" id="simTime">0.00 Myr</div></div>
            <div class="stat-item"><div class="stat-label">Energy</div><div class="stat-value" id="totalEnergy">0</div></div>
            <div class="stat-item"><div class="stat-label">Energy Drift</div><div class="stat-value" id="energyDrift">0.00%</div></div>
            <div class="stat-item"><div class="stat-label">Particles</div><div class="stat-value" id="particleCount">1000</div></div>
            <div class="stat-item"><div class="stat-label">Avg Velocity</div><div class="stat-value" id="avgVelocity">0 km/s</div></div>
            <div class="stat-item"><div class="stat-label">Avg Distance</div><div class="stat-value" id="avgDistance">0 pc</div></div>
        </div>
    </div>
</div>
<script>
    let canvas, ctx, isRunning = false, showQuadtree = false, zoom = 1.0, offsetX = 0, offsetY = 0, isDragging = false, lastMouseX, lastMouseY, lastFrameTime = 0;
    let simulationState = { particles: [], currentTime: 0, energy: 0, energyDrift: 0, particleCount: 0, avgVelocity: 0, avgDistanceToCenter: 0 };

    window.onload = () => {
        canvas = document.getElementById('galaxyCanvas');
        ctx = canvas.getContext('2d');
        setupEventListeners();
        startAnimationLoop();
        setInterval(updateSimulationData, 200);
        setInterval(updateUI, 1000);
        updateQuadtreeSettings();
    };

    function setupEventListeners() {
        canvas.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);
        canvas.addEventListener('mousemove', e => {
            if (isDragging) {
                offsetX += (e.clientX - lastMouseX) / (zoom * (canvas.width / 30000));
                offsetY -= (e.clientY - lastMouseY) / (zoom * (canvas.height / 30000));
                lastMouseX = e.clientX; lastMouseY = e.clientY;
            }
        });
        canvas.addEventListener('wheel', e => { e.preventDefault(); zoom *= e.deltaY > 0 ? 0.9 : 1.1; zoom = Math.max(0.1, Math.min(20, zoom)); });
        document.getElementById('playBtn').addEventListener('click', toggleSimulation);
        document.getElementById('resetBtn').addEventListener('click', () => postRequest('/api/reset', {}));

        const timeSlider = document.getElementById('timeScaleSlider'), timeInput = document.getElementById('timeScaleInput');
        timeInput.value = Math.pow(10, parseFloat(timeSlider.value)).toExponential(1);
        timeSlider.addEventListener('input', () => timeInput.value = Math.pow(10, parseFloat(timeSlider.value)).toExponential(1));
        timeSlider.addEventListener('change', () => postRequest('/api/timeScale', { timeScale: Math.pow(10, parseFloat(timeSlider.value)) }));
        timeInput.addEventListener('change', () => {
            const v = parseFloat(timeInput.value);
            if (!isNaN(v) && v > 0) {
                postRequest('/api/timeScale', { timeScale: v });
                timeSlider.value = Math.log10(v);
            }
            timeInput.value = Math.pow(10, parseFloat(timeSlider.value)).toExponential(1);
        });

        const countSlider = document.getElementById('particleCountSlider'), countInput = document.getElementById('particleCountInput');
        countInput.value = countSlider.value;
        countSlider.addEventListener('input', () => countInput.value = countSlider.value);
        countSlider.addEventListener('change', () => postRequest('/api/particleCount', { count: parseInt(countSlider.value, 10) }));
        countInput.addEventListener('change', () => {
            let v = parseInt(countInput.value, 10);
            v = isNaN(v) ? parseInt(countSlider.value, 10) : Math.max(parseInt(countSlider.min, 10), Math.min(v, parseInt(countSlider.max, 10)));
            countInput.value = v;
            countSlider.value = v;
            postRequest('/api/particleCount', { count: v });
        });

        document.getElementById('quadtreeOverlayCheck').addEventListener('change', updateQuadtreeSettings);
        document.getElementById('quadtreeDepthSlider').addEventListener('change', updateQuadtreeSettings);
        document.getElementById('barPotentialCheck').addEventListener('change', () => postRequest('/api/barPotential', { enabled: document.getElementById('barPotentialCheck').checked }));

        const armSlider = document.getElementById('spiralArmSlider');
        armSlider.addEventListener('change', () => {
            const arms = parseInt(armSlider.value, 10);
            document.getElementById('spiralArmValue').textContent = arms;
            postRequest('/api/spiralArms', { arms: arms });
        });
    }

    function startAnimationLoop() {
        const animate = t => {
            if (lastFrameTime > 0) document.getElementById('fps-counter').textContent = `FPS: ${Math.round(1000 / (t - lastFrameTime))}`;
            lastFrameTime = t;
            render();
            requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
    }

    async function updateSimulationData() {
        try {
            const res = await fetch('/api/state');
            simulationState = await res.json();
            isRunning = simulationState.isRunning;
        } catch (e) { console.error('Error fetching state:', e); }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (simulationState && simulationState.particles) {
            renderParticles(simulationState.particles);
            if (showQuadtree && simulationState.quadtreeBounds) renderQuadtree(simulationState.quadtreeBounds);
        }
    }

    function renderParticles(particles) {
        const scale = (canvas.width / 30000) * zoom, centerX = canvas.width / 2, centerY = canvas.height / 2;
        ctx.globalAlpha = 0.8;
        particles.forEach(p => {
            const screenX = centerX + (p.x - offsetX) * scale, screenY = centerY - (p.y - offsetY) * scale;
            if (screenX < -5 || screenX > canvas.width + 5 || screenY < -5 || screenY > canvas.height + 5) return;
            ctx.fillStyle = p.type === 'GIANT' ? '#ffca28' : '#42a5f5';
            ctx.beginPath();
            ctx.arc(screenX, screenY, Math.max(0.5, 1.2 * zoom), 0, 2 * Math.PI);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function renderQuadtree(bounds) {
        const scale = (canvas.width / 30000) * zoom, centerX = canvas.width / 2, centerY = canvas.height / 2;
        ctx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
        ctx.lineWidth = 1;
        bounds.forEach(b => {
            const w = b.size * 2 * scale, x = centerX + (b.x - b.size - offsetX) * scale, y = centerY - (b.y + b.size - offsetY) * scale;
            ctx.strokeRect(x, y, w, w);
        });
    }

    function updateUI() {
        if (!simulationState) return;
        document.getElementById('simTime').textContent = `${(simulationState.currentTime / 1e6).toFixed(2)} Myr`;
        document.getElementById('totalEnergy').textContent = simulationState.energy.toExponential(2);
        document.getElementById('energyDrift').textContent = `${(simulationState.energyDrift * 100).toFixed(3)}%`;
        document.getElementById('particleCount').textContent = simulationState.particleCount;
        document.getElementById('avgVelocity').textContent = `${Math.round(simulationState.avgVelocity)} km/s`;
        document.getElementById('avgDistance').textContent = `${Math.round(simulationState.avgDistanceToCenter)} pc`;
    }

    async function postRequest(url, body) {
        await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }

    async function toggleSimulation() {
        const btn = document.getElementById('playBtn');
        await postRequest(isRunning ? '/api/pause' : '/api/start', {});
        isRunning = !isRunning;
        btn.textContent = isRunning ? '⏸ Pause' : '▶ Start';
    }

    async function updateQuadtreeSettings() {
        const checkbox = document.getElementById('quadtreeOverlayCheck'), slider = document.getElementById('quadtreeDepthSlider');
        const depth = parseInt(slider.value, 10);
        showQuadtree = checkbox.checked;
        document.getElementById('quadtreeDepthValue').textContent = depth;
        await postRequest('/api/quadtree', { enabled: showQuadtree, depth: depth });
    }
</script>
</body>
</html>
